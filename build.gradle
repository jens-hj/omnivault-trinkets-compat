plugins { id 'base' }

allprojects {
	group = rootProject.property('group')
	version = rootProject.property('version')
	repositories {
		mavenCentral()
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.neoforged.net/releases' }
		exclusiveContent {
			forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
			filter { includeGroup 'maven.modrinth' }
		}
	}
}

tasks.named('build') { dependsOn ':common:build', ':fabric:build', ':neoforge:build' }
// Both loaders' versions go up together; the page body is shared.
tasks.register('modrinth') { dependsOn ':fabric:modrinth', ':neoforge:modrinth' }
tasks.register('modrinthSyncBody') { dependsOn ':fabric:modrinthSyncBody' }
tasks.register('runClientGameTest') { dependsOn ':fabric:runClientGameTest' }
tasks.register('runGameTestServer') { dependsOn ':neoforge:runGameTestServer' }
